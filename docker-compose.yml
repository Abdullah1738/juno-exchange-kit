services:
  junocashd:
    container_name: juno-exchange-kit-junocashd
    platform: linux/amd64
    image: juno-exchange-kit/junocashd:${JUNOCASH_VERSION:-0.9.13}
    build:
      context: .
      dockerfile: docker/junocashd/Dockerfile
      args:
        JUNOCASH_VERSION: ${JUNOCASH_VERSION:-0.9.13}
    environment:
      JUNO_CHAIN: ${JUNO_CHAIN:-regtest}
      JUNO_DATADIR: /data
      JUNO_RPC_USER: rpcuser
      JUNO_RPC_PASS: rpcpass
      JUNO_RPC_PORT: 8232
    command:
      - -server=1
      - -txindex=1
      - -daemon=0
      - -printtoconsole=1
      - -datadir=/data
      - -rpcbind=0.0.0.0
      - -rpcallowip=0.0.0.0/0
      - -rpcport=8232
      - -rpcuser=rpcuser
      - -rpcpassword=rpcpass
    ports:
      - "${JUNO_RPC_PORT_HOST:-28232}:8232"
    volumes:
      - junocashd-data:/data
    healthcheck:
      test: ["CMD", "juno-cli", "getblockcount"]
      interval: 2s
      timeout: 5s
      retries: 60

  juno-broadcast:
    container_name: juno-exchange-kit-broadcast
    platform: linux/amd64
    image: juno-exchange-kit/juno-broadcast:${JUNO_BROADCAST_REF:-76689b4d23bd27d0947f91aa7abccf8075c9782f}
    build:
      context: .
      dockerfile: docker/juno-broadcast/Dockerfile
      args:
        JUNO_BROADCAST_REF: ${JUNO_BROADCAST_REF:-76689b4d23bd27d0947f91aa7abccf8075c9782f}
    depends_on:
      junocashd:
        condition: service_healthy
    environment:
      JUNO_RPC_URL: http://junocashd:8232
      JUNO_RPC_USER: rpcuser
      JUNO_RPC_PASS: rpcpass
    command:
      - serve
      - --listen
      - 0.0.0.0:8080
    ports:
      - "${JUNO_BROADCAST_PORT_HOST:-18081}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 2s
      timeout: 2s
      retries: 60

  juno-scan:
    container_name: juno-exchange-kit-scan
    platform: linux/amd64
    image: juno-exchange-kit/juno-scan:${JUNO_SCAN_REF:-fcd02df03cf09b482f95be070b8fa9894d5c0222}
    build:
      context: .
      dockerfile: docker/juno-scan/Dockerfile
      args:
        JUNO_SCAN_REF: ${JUNO_SCAN_REF:-fcd02df03cf09b482f95be070b8fa9894d5c0222}
    depends_on:
      junocashd:
        condition: service_healthy
    environment:
      JUNO_SCAN_LISTEN: 0.0.0.0:8080
      JUNO_SCAN_RPC_URL: http://junocashd:8232
      JUNO_SCAN_RPC_USER: rpcuser
      JUNO_SCAN_RPC_PASS: rpcpass
      JUNO_SCAN_UA_HRP: ${JUNO_SCAN_UA_HRP:-jregtest}
      JUNO_SCAN_CONFIRMATIONS: ${JUNO_SCAN_CONFIRMATIONS:-100}
      JUNO_SCAN_DB_DRIVER: rocksdb
      JUNO_SCAN_DB_PATH: /data/db
    ports:
      - "${JUNO_SCAN_PORT_HOST:-18080}:8080"
    volumes:
      - junoscan-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/v1/health"]
      interval: 2s
      timeout: 2s
      retries: 60

volumes:
  junocashd-data:
  junoscan-data:
